name: Build Windows installer
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-installer
  cancel-in-progress: true
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download verified tools
        shell: pwsh
        run: ./get-tools.ps1
      - name: Build installer
        shell: pwsh
        run: ./build.ps1
      - name: Test yt-dlp integration
        shell: pwsh
        run: |
          ./tests/run-tests.ps1 -Integration
      - uses: actions/upload-artifact@v4
        with:
          name: OkVideo-Windows-Installer
          path: dist/OkVideo-Setup.exe
